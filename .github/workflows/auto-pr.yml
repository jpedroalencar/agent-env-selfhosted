# ============================================================
# auto-pr.yml — Automatically create Draft PRs
# ============================================================
# Uses the gh CLI (preinstalled on GitHub-hosted runners).
# The PR body is written to a file and passed via --body-file to
# avoid shell quoting / backtick command-substitution pitfalls.
#
# Triggers:
#   - push to any branch except main
#   - manual "Run workflow" (workflow_dispatch)

name: Auto Draft PR

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Create or update Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "main" ]; then
            echo "On '${BRANCH}' - skipping Draft PR creation."
            exit 0
          fi

          echo "Branch: ${BRANCH}"
          echo "Repository: ${{ github.repository }}"

          # Ensure origin/main ref exists locally for diff stats
          git fetch origin main:refs/remotes/origin/main || true
          STATS=$(git diff --stat origin/main...HEAD 2>/dev/null || echo "Unable to compute diff stats")
          COMMITS=$(git rev-list --count origin/main...HEAD 2>/dev/null || echo "?")
          LAST_COMMIT=$(git log --oneline -1)

          # --- Infer Conventional-Commits type(scope) from the diff ---
          # Single-purpose branches get a precise type(scope); mixed branches
          # get a consolidated title the human can edit at /squash time.
          HAS_TESTS=0; HAS_DOCS=0; HAS_CI=0; HAS_CODE=0; HAS_NEW=0
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
          if git diff --name-only --diff-filter=A origin/main...HEAD 2>/dev/null | grep -q .; then HAS_NEW=1; fi
          SCOPES=""
          HAS_TESTS=0; HAS_DOCS=0; HAS_CI=0; HAS_CODE=0; HAS_NEW=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              tests/*|*_test.py|test_*.py) HAS_TESTS=1 ;;
              docs/*|*.md) HAS_DOCS=1 ;;
              .github/*) HAS_CI=1 ;;
              pilot/*|adapters/*) HAS_CODE=1 ;;
            esac
            case "$f" in
              pilot/*) SCOPES="${SCOPES} platform" ;;
              adapters/*) SCOPES="${SCOPES} adapter" ;;
              .github/*) SCOPES="${SCOPES} ci" ;;
              scripts/*) SCOPES="${SCOPES} scripts" ;;
              docs/*|*.md) SCOPES="${SCOPES} docs" ;;
            esac
          done <<< "$CHANGED"
          # de-dupe scopes; prefer code scopes (platform/adapter) over ci/docs
          SCOPE=$(echo "$SCOPES" | tr ' ' '\n' \
            | awk 'NF&&!seen[$0]++' \
            | awk 'BEGIN{o["platform"]=1;o["adapter"]=2;o["ci"]=3;o["scripts"]=4;o["docs"]=5} {print (o[$0]?o[$0]:9)" "$0}' \
            | sort -n | cut -d' ' -f2 | head -2 | paste -sd, -)

          if [ "$HAS_TESTS" -eq 1 ] && [ "$HAS_CODE" -eq 0 ] && [ "$HAS_CI" -eq 0 ]; then
            TYPE="test"
          elif [ "$HAS_CI" -eq 1 ] && [ "$HAS_CODE" -eq 0 ] && [ "$HAS_DOCS" -eq 0 ]; then
            TYPE="ci"
          elif [ "$HAS_DOCS" -eq 1 ] && [ "$HAS_CODE" -eq 0 ] && [ "$HAS_CI" -eq 0 ]; then
            TYPE="docs"
          elif [ "$HAS_CODE" -eq 1 ] && [ "$HAS_NEW" -eq 1 ]; then
            TYPE="feat"
          else
            TYPE="fix"
          fi

          if [ -z "$SCOPE" ]; then
            TITLE="${TYPE}: ${BRANCH}"
          else
            TITLE="${TYPE}(${SCOPE}): ${BRANCH}"
          fi
          echo "Inferred PR title: ${TITLE}"

          # Write the PR body to a file to avoid shell quoting issues
          cat > pr_body.md <<EOF
          ## Summary

          Automated Draft PR for branch \`${BRANCH}\`.

          **Commits:** ${COMMITS}
          **Latest:** ${LAST_COMMIT}

          ---

          ### Diff Stats

          \`\`\`
          ${STATS}
          \`\`\`

          ---

          **To approve:** Click "Approve" -> PR merges automatically.
          **To reject:** Click "Request changes" -> PR closes.
          EOF

          echo "Checking for an existing open PR on branch ${BRANCH}..."
          EXISTING=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty' || echo "")

          if [ -n "${EXISTING}" ]; then
            echo "Updating existing Draft PR #${EXISTING}"
            gh pr edit "${EXISTING}" --title "${TITLE}" --body-file pr_body.md
          else
            echo "Creating Draft PR for ${BRANCH}..."
            gh pr create \
              --title "${TITLE}" \
              --body-file pr_body.md \
              --base main \
              --head "${BRANCH}" \
              --draft
          fi

          echo "Done."
